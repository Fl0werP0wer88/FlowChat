services:
  alloy:
    image: grafana/alloy:v1.12.1
    container_name: flowchat-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./Alloy/config.alloy:/etc/alloy/config.alloy:ro
      - flowchat_alloy_data:/var/lib/alloy/data
    networks:
      flowchat-observability:
        aliases:
          - flowchat-alloy
    restart: unless-stopped

volumes:
  flowchat_alloy_data:

networks:
  flowchat-observability:
    external: true
    name: flowchat-observability
