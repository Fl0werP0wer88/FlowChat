services:
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: flowchat-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - flowchat_prometheus_data:/prometheus
    networks:
      flowchat-observability:
        aliases:
          - flowchat-prometheus
    restart: unless-stopped

volumes:
  flowchat_prometheus_data:
    external: true
    name: flowchat-observability_flowchat_prometheus_data

networks:
  flowchat-observability:
    external: true
    name: flowchat-observability
